<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="3240" viewBox="0 0 2280 3240" role="img" aria-labelledby="title desc"><title id="title">V11 AI Edit synthetic design evidence</title><desc id="desc">Paired 1080 by 2340 light and dark primary frames with labeled states; not runtime screenshots.</desc><defs><style>.t{font:700 50px Arial}.h{font:600 28px Arial}.b{font:23px Arial}.d{font:600 38px Arial}.m{font:600 17px Arial}.mist{fill:#F2F3F8}.lapis{fill:#2639C9}.white{fill:#fff}.arrow{stroke:#2639C9;stroke-width:8}</style><g id="photo"><rect width="254" height="210" rx="16" fill="#8C9BFF"/><path d="M0 210L90 80L150 140L254 40V210Z" fill="#2639C9"/></g><g id="phone"><rect width="1080" height="2340" rx="50" fill="var(--bg)" stroke="var(--sec)" stroke-width="4"/><text x="64" y="84" class="m" fill="var(--sec)">SYNTHETIC · 1080 × 2340 · 100% TYPE</text><text x="64" y="174" class="t" fill="var(--link)">AI Edit canvas — provider ready</text><text x="64" y="222" class="b" fill="var(--sec)">24 dp sides · 48 dp status · 72 dp bottom safe inset</text><rect x="64" y="280" width="952" height="700" rx="16" fill="#8C9BFF"/><path d="M64 980L394 550L624 750L1016 420V980Z" fill="var(--brand)"/><text x="104" y="1080" class="h" fill="var(--ink)">Primary task · synthetic photos</text><use href="#photo" x="104" y="1140"/><use href="#photo" x="390" y="1140"/><use href="#photo" x="676" y="1140"/><circle cx="752" cy="1172" r="26" fill="var(--brand)" stroke="#fff" stroke-width="4"/><text x="104" y="1540" class="h" fill="var(--ink)">200% typography check</text><text x="104" y="1610" class="d" fill="var(--ink)">Readable text wraps</text><text x="104" y="1670" class="d" fill="var(--ink)">without hiding actions</text><path d="M180 1980C330 1840 610 1840 780 1980" fill="none" stroke="var(--link)" stroke-width="8"/><text x="64" y="2070" class="b" fill="var(--sec)">Touch ① choose → ② review → ③ continue</text><rect x="180" y="2140" width="720" height="120" rx="48" fill="var(--brand)"/><tex