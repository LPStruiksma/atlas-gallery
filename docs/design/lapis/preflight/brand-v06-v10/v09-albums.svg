<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="2340" viewBox="0 0 2160 2340" role="img" aria-labelledby="title desc"><title id="title">V09 · Albums paired light/dark preflight</title><desc id="desc">Two bounded 1080 by 2340 synthetic panels with state, accessibility, inset, type and motion notes.</desc><style>text{font-family:'Funnel Sans',Arial,sans-serif;fill:var(--ink)}.t{font-size:52px;font-weight:700}.s{font-size:28px;font-weight:600}.b{font-size:25px}.m{font-size:19px}.accent{fill:var(--accent)}.secondary{fill:var(--secondary)}.brand{fill:var(--brand)}.white{fill:#FFF}.arrow{stroke:var(--accent);stroke-width:6;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8C9BFF"/></marker><symbol id="panel" viewBox="0 0 1080 2340"><rect width="1080" height="2340" fill="var(--bg)"/><rect width="1080" height="72" fill="var(--surface)"/><text x="48" y="46" class="m">09:41 · synthetic S24+ · 1080×2340</text><text x="48" y="145" class="s accent">V09 · Albums</text><text x="48" y="230" class="t accent">Create album</text><text x="48" y="280" class="b secondary">IME open · Hidden/private · Choose cover</text><g class="brand" data-synthetic-media="abstract-colour-fields"><rect x="48" y="330" width="190" height="190" rx="8"/><rect x="240" y="330" width="270" height="190" rx="8" opacity=".7"/><rect x="512" y="330" width="150" height="190" rx="8" opacity=".5"/><rect x="664" y="330" width="368" height="190" rx="8" opacity=".3"/></g><text x="48" y="557" class="m secondary">Synthetic only · 8 dp corners · 2 dp gaps</text><rect x="48" y="620" width="984" height="620" rx="22" fill="var(--surface)"/><text x="84" y="700" class="s accent">Weekend walks</text><text x="84" y="775" class="b">Cancel · Create</text><text x="84" y="835" class="m secondary">Cover change offers Undo</text><circle cx="130" cy="950" r="34" fill="var(--brand)" stroke="#FFF" stroke-width="4"/><text x="130" y="960" text-anchor="middle" class="b white">1</text><path d="M190 950H510" class="arrow"/><text x="190" y="925" class="m secondary">TalkBack focus / gesture →</text><rect x="650" y="890" width="330" height="112" rx="56" fill="var(--brand)"/><text x="815" y="960" text-anchor="middle" class="s white">Continue</text><text x="84" y="1125" class="m secondary">≥48 dp targets · sphere + 2 dp white halo</text><rect x="48" y="1330" width="984" height="330" rx="22" fill="var(--surface)"/><text x="84" y="1410" class="s accent">100% / 200% type</text><text x="84" y="1475" class="b">Wrap/grow; keep focus above IME.</text><text x="84" y="1535" class="m secondary">Lift 200 ms · remove animations: immediate</text><path d="M970 1710V2040" class="arrow"/><text x="940" y="1690" text-anchor="end" class="m secondary">one-hand reach ↓</text><rect x="150" y="2070" width="780" height="140" rx="24" fill="var(--brand)"/><text x="540" y="2157" text-anchor="middle" class="s white">24 dp slab · 48 dp actions</text><rect y="2268" width="1080" height="72" fill="var(--surface)"/><text x="48" y="2312" class="m secondary">Insets: status/nav 72 px · IME 488 px</text></symbol></defs><use href="#panel" width="1080" height="2340" data-theme="light" style="--bg:#FFF;--surface:#F2F3F8;--ink:#0E1030;--secondary:#5A5F7A;--brand:#2639C9;--accent:#2639C9"/><use href="#panel" x="1080" width="1080" height="2340" data-theme="dark" style="--bg:#000;--surface:#14152A;--ink:#F2F3F8;--secondary:#9AA0B8;--brand:#3448E0;--accent:#8C9BFF"/></svg>
