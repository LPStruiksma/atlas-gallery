<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340" role="img" aria-labelledby="title desc"><title id="title">V05 dark synthetic phone pre-build evidence</title><desc id="desc">Synthetic illustration, no real faces or photos. Proposed Quiet Frame v3 states, not an Android runtime screenshot. Insets, gestures, type and touch bounds are assumptions for independent review.</desc><rect x="0" y="0" width="1080" height="2340" rx="0" fill="#000000" /><rect x="0" y="0" width="1080" height="76" rx="0" fill="#14152A" /><text x="50" y="53" font-family="Funnel Sans,Arial,sans-serif" font-size="27" font-weight="600" fill="#F2F3F8" >09:41</text><text x="770" y="53" font-family="Funnel Sans,Arial,sans-serif" font-size="25" font-weight="600" fill="#9AA0B8" >▰  ◖  88%</text><text x="50" y="129" font-family="Funnel Sans,Arial,sans-serif" font-size="26" font-weight="600" fill="#9AA0B8" >BRAND-VE1 / V05 / DARK</text><text x="52" y="236" font-family="Funnel Display,Arial,sans-serif" font-size="80" font-weight="700" fill="#8C9BFF" >Review people</text><text x="54" y="301" font-family="Funnel Sans,Arial,sans-serif" font-size="32" font-weight="400" fill="#9AA0B8" >Same person? · explicit decision</text><text x="54" y="371" font-family="Funnel Sans,Arial,sans-serif" font-size="38" font-weight="600" fill="#F2F3F8" >Do these photos show the same person?</text><rect x="52" y="416" width="975" height="600" rx="22" fill="#14152A" /><rect x="93" y="452" width="405" height="425" rx="8" fill="#14152A" /><clipPath id="pic700"><rect x="93" y="452" width="405" height="425" rx="8"/></clipPath><g clip-path="url(#pic700)"><rect x="93" y="452" width="405" height="225.25" rx="0" fill="#8C9BFF" opacity=".28"/><circle cx="206.4" cy="562.5" r="40.5" fill="#FFFFFF" opacity=".83"/><path d="M93 877 L93 710.5 L210.45 596.5 L311.70000000000005 728.25 L404.85 630.5 L498 708.5 L498 877 Z" fill="#F2F3F8" opacity=".48"/><path d="M93 877 L93 792 Q267.15 673 498 800.5 L498 877 Z" fill="#3448E0" opacity=".66"/></g><rect x="540" y="452" width="430" height="425" rx="8" fill="#14152A" /><clipPath id="pic701"><rect x="540" y="452" width="430" height="425" rx="8"/></clipPath><g clip-path="url(#pic701)"><rect x="540" y="452" width="430" height="225.25" rx="0" fill="#3448E0" opacity=".50"/><circle cx="841" cy="562.5" r="42.5" fill="#FFFFFF" opacity=".83"/><path d="M540 877 L540 710.5 L664.7 596.5 L772.2 728.25 L871.1 630.5 L970 708.5 L970 877 Z" fill="#F2F3F8" opacity=".48"/><path d="M540 877 L540 792 Q724.9 673 970 800.5 L970 877 Z" fill="#3448E0" opacity=".66"/></g><text x="120" y="938" font-family="Funnel Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#9AA0B8" >Photo A · synthetic</text><text x="560" y="938" font-family="Funnel Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#9AA0B8" >Photo B · synthetic</text><rect x="72" y="1050" width="446" height="140" rx="48" fill="#3448E0" /><text x="295" y="1136" font-family="Funnel Sans,Arial,sans-serif" font-size="36" font-weight="650" fill="#FFFFFF" text-anchor="middle">Yes, same</text><rect x="540" y="1050" width="471" height="140" rx="48" fill="#14152A" stroke="#9AA0B8" stroke-width="2"/><text x="777" y="1136" font-family="Funnel Sans,Arial,sans-serif" font-size="34" font-weight="650" fill="#F2F3F8" text-anchor="middle">No, different</text><rect x="53" y="1248" width="974" height="330" rx="22" fill="#14152A" /><text x="84" y="1324" font-family="Funnel Sans,Arial,sans-serif" font-size="38" font-weight="650" fill="#8C9BFF" >Unknown-face review</text><text x="84" y="1390" font-family="Funnel Sans,Arial,sans-serif" font-size="29" font-weight="400" fill="#F2F3F8" >Choose a name or leave as unknown.</text><circle cx="116" cy="1456" r="28" fill="#3448E0" stroke="#FFFFFF" stroke-width="5"/><text x="161" y="1469" font-family="Funnel Sans,Arial,sans-serif" font-size="29" font-weight="400" fill="#F2F3F8" >Keep as unknown  →  next face</text><rect x="53" y="1600" width="974" height="480" rx="22" fill="#14152A" /><text x="84" y="1680" font-family="Funnel Sans,Arial,sans-serif" font-size="38" font-weight="650" fill="#8C9BFF" >Split group confirmation</text><text x="84" y="1750" font-family="Funnel Sans,Arial,sans-serif" font-size="29" font-weight="400" fill="#F2F3F8" >Move 3 selected photos to a new person?</text><text x="84" y="1806" font-family="Funnel Sans,Arial,sans-serif" font-size="28" font-weight="400" fill="#9AA0B8" >Back cancels. Confirm names the action.</text><rect x="82" y="1860" width="445" height="120" rx="45" fill="#3448E0" /><text x="305" y="1935" font-family="Funnel Sans,Arial,sans-serif" font-size="33" font-weight="650" fill="#FFFFFF" text-anchor="middle">Confirm split</text><rect x="540" y="1860" width="450" height="120" rx="45" fill="#000000" /><text x="763" y="1935" font-family="Funnel Sans,Arial,sans-serif" font-size="33" font-weight="650" fill="#F2F3F8" text-anchor="middle">Cancel</text><text x="52" y="2162" font-family="Funnel Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#9AA0B8" >After choice: announce saved → offer Undo  (48 dp)</text><text x="52" y="2210" font-family="Funnel Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#9AA0B8" >Focus: question → A → B → Yes / No → Next</text><text x="52" y="2263" font-family="Funnel Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#9AA0B8" >200%: question wraps; controls stack vertically</text></svg>
