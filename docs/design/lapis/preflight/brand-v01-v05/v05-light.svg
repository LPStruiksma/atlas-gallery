<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340" role="img" aria-labelledby="title desc"><title id="title">V05 light synthetic phone pre-build evidence</title><desc id="desc">Synthetic illustration, no real faces or photos. Proposed Quiet Frame v3 states, not an Android runtime screenshot. Insets, gestures, type and touch bounds are assumptions for independent review.</desc><rect x="0" y="0" width="1080" height="2340" rx="0" fill="#FFFFFF" /><rect x="0" y="0" width="1080" height="76" rx="0" fill="#F2F3F8" /><text x="50" y="53" font-family="Funnel Sans,Arial,sans-serif" font-size="27" font-weight="600" fill="#0E1030" >09:41</text><text x="770" y="53" font-family="Funnel Sans,Arial,sans-serif" font-size="25" font-weight="600" fill="#5A5F7A" >▰  ◖  88%</text><text x="50" y="129" font-family="Funnel Sans,Arial,sans-serif" font-size="26" font-weight="600" fill="#5A5F7A" >BRAND-VE1 / V05 / LIGHT</text><text x="52" y="236" font-family="Funnel Display,Arial,sans-serif" font-size="80" font-weight="700" fill="#2639C9" >Review people</text><text x="54" y="301" font-family="Funnel Sans,Arial,sans-serif" font-size="32" font-weight="400" fill="#5A5F7A" >Same person? · explicit decision</text><text x="54" y="371" font-family="Funnel Sans,Arial,sans-serif" font-size="38" font-weight="600" fill="#0E1030" >Do these photos show the same person?</text><rect x="52" y="416" width="975" height="600" rx="22" fill="#F2F3F8" /><rect x="93" y="452" width="405" height="425" rx="8" fill="#F2F3F8" /><clipPath id="pic700"><rect x="93" y="452" width="405" height="425" rx="8"/></clipPath><g clip-path="url(#pic700)"><rect x="93" y="452" width="405" height="225.25" rx="0" fill="#2639C9" opacity=".28"/><circle cx="206.4" cy="562.5" r="40.5" fill="#FFFFFF" opacity=".83"/><path d="M93 877 L93 710.5 L210.45 596.5 L311.70000000000005 728.25 L404.85 630.5 L498 708.5 L498 877 Z" fill="#0E1030" opacity=".48"/><path d="M93 877 L93 792 Q267.15 673 498 800.5 L498 877 Z" fill="#2639C9" opacity=".66"/></g><rect x="540" y="452" width="430" height="425" rx="8" fill="#F2F3F8" /><clipPath id="pic701"><rect x="540" y="452" width="430" height="425" rx="8"/></clipPath><g clip-path="url(#pic701)"><rect x="540" y="452" width="430" height="225.25" rx="0" fill="#2639C9" opacity=".50"/><circle cx="841" cy="562.5" r="42.5" fill="#FFFFFF" opacity=".83"/><path d="M540 877 L540 710.5 L664.7 596.5 L772.2 728.25 L871.1 630.5 L970 708.5 L970 877 Z" fill="#0E1030" opacity=".48"/><path d="M540 877 L540 792 Q724.9 673 970 800.5 L970 877 Z" fill="#2639C9" opacity=".66"/></g><text x="120" y="938" font-family="Funnel Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#5A5F7A" >Photo A · synthetic</text><text x="560" y="938" font-family="Funnel Sans,Arial,sans-serif" font-size="27" font-weight="400" fill="#5A5F7A" >Photo B · synthetic</text><rect x="72" y="1050" width="446" height="140" rx="48" fill="#2639C9" /><text x="295" y="1136" font-family="Funnel Sans,Arial,sans-serif" font-size="36" font-weight="650" fill="#FFFFFF" text-anchor="middle">Yes, same</text><rect x="540" y="1050" width="471" height="140" rx="48" fill="#F2F3F8" stroke="#5A5F7A" stroke-width="2"/><text x="777" y="1136" font-family="Funnel Sans,Arial,sans-serif" font-size="34" font-weight="650" fill="#0E1030" text-anchor="middle">No, different</text><rect x="53" y="1248" width="974" height="480" rx="22" fill="#F2F3F8" /><text x="84" y="1313" font-family="Funnel Sans,Arial,sans-serif" font-size="37" font-weight="600" fill="#2639C9" >Unknown face · assign or skip</text><rect x="84" y="1350" width="220" height="304" rx="8" fill="#FFFFFF" stroke="#5A5F7A" stroke-width="2"/><rect x="90" y="1356" width="208" height="150" rx="8" fill="#2639C9" opacity=".42"/><path d="M104 1646 Q112 1550 192 1540 Q279 1540 287 1646 Z" fill="#FFFFFF" opacity=".72"/><ellipse cx="194" cy="1453" rx="56" ry="76" fill="#FFFFFF" opacity=".92"/><circle cx="174" cy="1444" r="5" fill="#0E1030"/><circle cx="213" cy="1444" r="5" fill="#0E1030"/><path d="M179 1480 Q195 1492 209 1480" stroke="#0E1030" stroke-width="4" fill="none" stroke-linecap="round"/><text x="94" y="1694" font-family="Funnel Sans,Arial,sans-serif" font-size="25" font-weight="600" fill="#5A5F7A" >Face in context</text><rect x="326" y="1350" width="673" height="144" rx="22" fill="#FFFFFF" stroke="#5A5F7A" stroke-width="3"/><text x="352" y="1439" font-family="Funnel Sans,Arial,sans-serif" font-size="29" font-weight="600" fill="#0E1030" >Search people / enter a name</text><rect x="326" y="1510" width="320" height="144" rx="45" fill="#2639C9" /><text x="486" y="1599" font-family="Funnel Sans,Arial,sans-serif" font-size="29" font-weight="600" fill="#FFFFFF" text-anchor="middle">Assign Avery</text><rect x="660" y="1510" width="339" height="144" rx="45" fill="#FFFFFF" stroke="#5A5F7A" stroke-width="3"/><text x="829" y="1599" font-family="Funnel Sans,Arial,sans-serif" font-size="29" font-weight="600" fill="#0E1030" text-anchor="middle">Keep unknown</text><rect x="53" y="1742" width="974" height="352" rx="22" fill="#F2F3F8" /><text x="84" y="1811" font-family="Funnel Sans,Arial,sans-serif" font-size="37" font-weight="600" fill="#2639C9" >Split group confirmation</text><text x="84" y="1861" font-family="Funnel Sans,Arial,sans-serif" font-size="28" font-weight="600" fill="#0E1030" >Move 3 selected photos to a new person?</text><rect x="84" y="1902" width="441" height="144" rx="45" fill="#2639C9" /><text x="304" y="1993" font-family="Funnel Sans,Arial,sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" text-anchor="middle">Confirm split</text><rect x="542" y="1902" width="454" height="144" rx="45" fill="#FFFFFF" stroke="#5A5F7A" stroke-width="3"/><text x="769" y="1993" font-family="Funnel Sans,Arial,sans-serif" font-size="32" font-weight="600" fill="#0E1030" text-anchor="middle">Cancel</text><text x="52" y="2162" font-family="Funnel Sans,Arial,sans-serif" font-size="26" font-weight="400" fill="#5A5F7A" >Back cancels; after confirm → announce + Undo</text><text x="52" y="2210" font-family="Funnel Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#5A5F7A" >Focus: face → name search → Assign / Skip → split</text><text x="52" y="2263" font-family="Funnel Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#5A5F7A" >200%: question wraps; controls stack vertically</text></svg>
