<text x="408.0" y="44" fill="#111318">Gesture priority (highest wins where regions overlap):</text>
<text x="408.0" y="56" fill="#111318">1  System edge zones: none in three-button mode; red bands show a 24 dp PLACEHOLDER,</text>
<text x="408.0" y="68" fill="#111318">   EXCEPT inside the strip and seek bands, which request gesture exclusion</text>
<text x="408.0" y="80" fill="#111318">   (76.0 + 48.0 = 124.0 dp per edge, under Android&#x27;s 200 dp cap).</text>
<text x="408.0" y="92" fill="#111318">   Dashed white boxes = requested exclusion rects (only while chrome is shown).</text>
<text x="408.0" y="104" fill="#111318">   The bottom mandatory home zone is never excluded; no hit rect enters it.</text>
<text x="408.0" y="116" fill="#111318">2  Seek drag: touch-down in the seek hit band consumes the gesture; no chrome</text>
<text x="408.0" y="128" fill="#111318">   toggle, no pager swipe; holding swaps the strip band for frame thumbnails</text>
<text x="408.0" y="140" fill="#111318">   (VIEW:V16-V18, UNVERIFIED).</text>
<text x="408.0" y="152" fill="#111318">3  Strip drag: horizontal slop inside the band scrubs; tap = nearest tile centre.</text>
<text x="408.0" y="164" fill="#111318">   Consumed; never toggles chrome.</text>
<text x="408.0" y="176" fill="#111318">4  Buttons: 48 dp hit rects; a press that slides off cancels.</text>
<text x="408.0" y="188" fill="#111318">5  Media: single tap toggles chrome + system bars (200 ms Lift, waits out</text>
<text x="408.0" y="200" fill="#111318">   the double-tap timeout); double-tap zoom x2.31; pinch; horizontal = pager;</text>
<text x="408.0" y="212" fill="#111318">   swipe up = Details; swipe down = close (unzoomed only).</text>
<text x="408.0" y="224" fill="#111318"></text>
<text x="408.0" y="236" fill="#111318">TalkBack order (numbers on the left):</text>
<text x="408.0" y="248" fill="#111318">1 Back · 2 date · time · place (one node) · 3-5 top actions (only those shown)</text>
<text x="408.0" y="260" fill="#111318">· 6 media (&quot;Photo N of M: &lt;title&gt;&quot;, state: controls shown/hidden)</text>
<text x="408.0" y="272" fill="#111318">· 7 play/pause · 8 seek (adjustable, value = elapsed of duration)</text>
<text x="408.0" y="284" fill="#111318">· 9 filmstrip (collection; current tile selected; custom actions</text>
<text x="408.0" y="296" fill="#111318">  previous/next) · 10-13 favourite, edit, share, delete.</text>
<text x="408.0" y="308" fill="#111318">Hidden chrome: only the media node + system back remain; a TalkBack</text>
<text x="408.0" y="320" fill="#111318">double-tap on media shows chrome again. Spoken output is NOT_CAPTURED.</text>
</svg>
