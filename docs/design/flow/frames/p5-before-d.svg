 <text x="34" y="2161" font-size="23" fill="#dce1ff">Same white landmark: media (520.769,1109.231) → screen (625,1030)</text>
 <text x="34" y="2198" font-size="22" fill="#ffdc65">One (u,r,q), identical crop and shared T; no jump or empty pixels</text>
 <text x="34" y="2230" font-size="20" fill="#dce1ff">SAFE INSETS SCHEMATIC / UNMEASURED · NOT DEVICE EVIDENCE</text>
</g>
