<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2340" viewBox="0 0 1080 2340" role="img" aria-labelledby="title desc">
<title id="title">FLOW-6 P5-A · Before HQ ready dark synthetic full-screen preflight</title>
<desc id="desc">Synthetic, not an emulator. Current (u,r,q) preview remains fully opaque while zoomed HQ is pending. Nonzero pan +110,-85 and 1.30 zoom, identical for both registered layers. Source landmark at 520.769,1109.231 maps to held screen anchor 625,1030. Schematic safe insets are unmeasured.</desc>
<defs>
 <linearGradient id="preview" x2="0" y2="1"><stop stop-color="#8dccf0"/><stop offset=".5" stop-color="#ffd38b"/><stop offset="1" stop-color="#51365b"/></linearGradient>
 <linearGradient id="hq" x2="0" y2="1"><stop stop-color="#32a6da"/><stop offset=".5" stop-color="#f2b453"/><stop offset="1" stop-color="#762654"/></linearGradient>
 <pattern id="previewGrid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#d8c5d6" stroke-width="3" fill="none"/></pattern>
 <clipPath id="screenClip"><rect x="0" y="90" width="1080" height="2160"/></clipPath>
</defs>
<rect width="1080" height="2340" fill="#000"/>
<rect y="0" width="1080" height="90" fill="#14152a"/><rect y="2250" width="1080" height="90" fill="#14152a"/>
<rect x="30" y="20" width="100" height="52" rx="13" fill="#3448E0"/><text x="80" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#fff">D</text>
<text x="150" y="56" font-family="Arial,sans-serif" font-size="26" fill="#f2f3f8">S24+ 1080 × 2340 · SYNTHETIC / NOT EMULATOR</text>
<!-- Shared C is the screen-space viewport; preview and HQ have a single parent T. -->
<g clip-path="url(#screenClip)">
 <g id="shared-media-transform" transform="translate(110 -85) translate(540 1090) scale(1.3) translate(-540 -1090)">
 <g id="registered-preview" opacity="1"><rect x="0" y="450" width="1080" height="1440" fill="url(#preview)"/>
<circle cx="820.8" cy="723.6" r="70.2" fill="#fff2b3"/>
<path d="M0 1544.4 L270 939.6 L496.8 1342.8 L680.4 1054.8 L1080 1573.2 V1890 H0Z" fill="#392e60"/>
<path d="M0 1674 Q226.8 1400.4 518.4 1645.2 T1080 1472.4V1890H0Z" fill="#1e807c"/>
<path d="M64.8 1702.8 Q313.2 1501.2 518.4 1688.4T1015.2 1630.8" fill="none" stroke="#87cbbb" stroke-width="14" opacity=".78"/>
<path d="M 520.769 1091.231 L 527.769 1102.231 L 540.769 1109.231 L 527.769 1116.231 L 520.769 1127.231 L 513.769 1116.231 L 500.769 1109.231 L 513.769 1102.231 Z" fill="#ffffff" stroke="#3d2864" stroke-width="3"/>
<rect x="0" y="450" width="1080" height="1440" fill="url(#previewGrid)" opacity=".22"/></g>
 
 <rect id="transformed-fit-r" x="0" y="450" width="1080" height="1440" fill="none" stroke="#65f4ff" stroke-width="7" stroke-dasharray="24 18"/>
 </g>
</g>
<rect id="fixed-viewport-c" x="12" y="102" width="1056" height="2136" fill="none" stroke="#ffdc65" stroke-width="5" stroke-dasharray="22 20"/>
<!-- Fixed screen marker is outside T in every stage: same media landmark underneath. -->
<g id="fixed-screen-finger-anchor" stroke="#ff5a91" fill="none"><circle cx="625" cy="1030" r="58" stroke-width="9"/><path d="M625 920V1140 M515 1030H735" stroke-width="5"/></g>
<g id="unchanged-viewer-chrome">
 <g id="filmstrip"><rect x="305" y="1805" width="140" height="125" rx="10" fill="#302958"/><rect x="470" y="1805" width="140" height="125" rx="10" fill="#307e7c" stroke="#fff" stroke-width="2"/><rect x="635" y="1805" width="140" height="125" rx="10" fill="#262552"/><circle cx="540" cy="1784" r="18" fill="#8c9bff"/></g>
 <rect x="154" y="1953" width="772" height="165" rx="36" fill="#3448e0"/><g fill="#fff"><circle cx="335" cy="2035" r="22"/><rect x="514" y="2015" width="52" height="40" rx="10"/><path d="M730 2015l30 45h-60z"/></g>
</g>
<g id="review-annotations-not-app-ui" font-family="Arial,sans-serif">
 <rect x="24" y="126" width="1032" height="188" rx="14" fill="#060713" opacity=".92"/>
 <text x="52" y="185" font-size="43" font-weight="700" fill="#fff">P5-A · Before HQ ready</text>
 <text x="52" y="239" font-size="28" fill="#dce1ff">Preview = 1.00 | HQ = 0.00 | hold zoomed preview</text>
 <text x="52" y="283" font-size="24" fill="#ffdc65">Yellow C fixed · cyan R transformed identically · pink anchor fixed</text>
 <rect x="30" y="325" width="1020" height="119" rx="12" fill="#060713" opacity=".91"/>
 <text x="55" y="366" font-size="27" font-weight="700" fill="#fff">BOTTOM → TOP: preview α1 → (HQ pending)</text>
