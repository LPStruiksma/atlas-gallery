<g transform="translate(110,454)">
<text x="0" y="0" font-size="7.8" fill="#F2F3F8">Release invariance: from ACTION_UP until exact confirmation the strip offset x_r, requested T_r = clamp(map(x_r), 0, T_max) and the elapsed label are frozen and follow is off.</text>
<text x="0" y="12" font-size="7.8" fill="#F2F3F8">Resume happens only after the matching-generation confirmation. Follow then starts at T_r with lead 0 and the 200 ms lead [V16] grows only as playback advances (no +200 ms jump).</text>
<text x="0" y="24" font-size="7.8" fill="#F2F3F8">Preview PTS are approximate unless reported by the decoder; the exact frame's decoded PTS is recorded, not promised. No snap to a frame tile: the time axis is continuous.</text>
</g></svg>