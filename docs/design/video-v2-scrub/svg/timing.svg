<g transform="translate(110,428)">
<text x="0" y="0" font-size="7.8" fill="#F2F3F8">Release invariance: at ACTION_UP the strip offset x_r, target T_r = clamp(map(x_r), 0, d − 1 frame) and the elapsed label are frozen; the commit only replaces the preview image with the decoded frame at T_r.</text>
<text x="0" y="12" font-size="7.8" fill="#F2F3F8">A fling ends with the same rule at its rest offset. No snap to a frame tile: the time axis is continuous; frame tiles are only a visual index.</text>
