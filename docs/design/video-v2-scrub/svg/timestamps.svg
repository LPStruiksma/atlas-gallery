<text x="285.45" y="276" font-size="6.8" fill="#2EC4B6" text-anchor="middle">PTS 5.98</text>
<line x1="368.17" y1="254" x2="368.17" y2="266" stroke="#9AA0B8"/>
<circle cx="371.77" cy="260" r="3" fill="#2EC4B6"/>
<text x="371.77" y="276" font-size="6.8" fill="#2EC4B6" text-anchor="middle">PTS 9.10</text>
<line x1="450.89" y1="254" x2="450.89" y2="266" stroke="#9AA0B8"/>
<circle cx="432.63" cy="260" r="3" fill="#2EC4B6"/>
<text x="432.63" y="276" font-size="6.8" fill="#2EC4B6" text-anchor="middle">PTS 11.30</text>
<line x1="533.62" y1="254" x2="533.62" y2="266" stroke="#9AA0B8"/>
<circle cx="533.62" cy="260" r="3" fill="#2EC4B6"/>
<text x="533.62" y="276" font-size="6.8" fill="#2EC4B6" text-anchor="middle">PTS 14.95</text>
<circle cx="404.97" cy="246" r="3.6" fill="#8C9BFF"/>
<text x="412.97" y="249" font-size="7.4" fill="#F2F3F8">T = 10.30 s → tile 4 by decoded PTS (1,000 ms away), not tile 3 by nominal offset</text>
<text x="12" y="314" font-size="8" fill="#FFF">PTS unknown</text>
<line x1="120" y1="310" x2="950" y2="310" stroke="#5A5C6A"/>
<rect x="117.0" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<rect x="199.72" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<rect x="282.45" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<rect x="365.17" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<rect x="447.89" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<rect x="530.62" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<rect x="613.34" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<rect x="696.06" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<rect x="778.79" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<rect x="861.51" y="307" width="6" height="6" fill="none" stroke="#9AA0B8" stroke-dasharray="1 1"/>
<text x="120" y="328" font-size="7.4" fill="#F2F3F8">Extractor gave no PTS (e.g. a bitmap-only retriever): tiles are an index only; preview marked approximate/unknown; no error bound claimed; endpoint decode still requested near the ends.</text>
<text x="12" y="354" font-size="8" fill="#FFF">near the start</text>
<line x1="120" y1="350" x2="950" y2="350" stroke="#5A5C6A"/>
<circle cx="120.0" cy="350" r="3.6" fill="#8C9BFF"/><circle cx="131.07" cy="362" r="3" fill="#2EC4B6"/>
<text x="139.07" y="365" font-size="7.4" fill="#F2F3F8">T = 0: tile 0 came from the nearest sync frame at PTS 0.40 s → approximate, 400 ms error; never labelled exact</text>
<text x="12" y="392" font-size="7.8" fill="#FFF" font-weight="600">Requested / displayed T</text>
<text x="170" y="392" font-size="7.8" fill="#F2F3F8">from the strip offset; drives sphere, seek-bar thumb and elapsed label; never changed by a decode result</text>
<text x="12" y="405" font-size="7.8" fill="#FFF" font-weight="600">Nominal offset t_i</text>
<text x="170" y="405" font-size="7.8" fill="#F2F3F8">V16 extraction request time for tile i; an index, not a timestamp</text>
<text x="12" y="418" font-size="7.8" fill="#FFF" font-weight="600">Preview PTS</text>
<text x="170" y="418" font-size="7.8" fill="#F2F3F8">PTS of the cached tile or CLOSEST_SYNC / endpoint frame when the decoder reports it; else unknown; always approximate unless equal to T</text>
<text x="12" y="431" font-size="7.8" fill="#FFF" font-weight="600">Exact decoded PTS</text>
<text x="170" y="431" font-size="7.8" fill="#F2F3F8">PTS of the frame the EXACT seek rendered; recorded for the proof; accuracy is measured, not inferred (no fixed frame-interval promise, VFR)</text>
<text x="12" y="444" font-size="7.8" fill="#FFF" font-weight="600">End clamp T_max</text>
<text x="170" y="444" font-size="7.8" fill="#F2F3F8">min(d, last decodable PTS) when known; else d − 100 ms marked approximate; start clamp 0</text>
<text x="12" y="457" font-size="7.8" fill="#FFF" font-weight="600">Endpoint decode</text>
<text x="170" y="457" font-size="7.8" fill="#F2F3F8">T past the last tile's PTS (nominal if unknown) or before tile 0's PTS (< half interval if unknown), AND best preview > half interval away or PTS unknown</text>
</svg>