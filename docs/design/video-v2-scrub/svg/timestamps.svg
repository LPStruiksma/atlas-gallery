<text x="864.51" y="61" font-size="6.8" fill="#9AA0B8" text-anchor="middle">t9 26.91</text>
<line x1="950.0" y1="62" x2="950.0" y2="78" stroke="#FF5A5F"/><text x="950.0" y="88" font-size="6.8" fill="#FF5A5F" text-anchor="end">d 30.00</text>
<path d="M864.51 100 v6 H949.08 v-6" fill="none" stroke="#FFB020" stroke-width="1.4"/>
<text x="860.51" y="116" font-size="7.4" fill="#FFB020" text-anchor="end">end gap 3,057 ms &gt; half tile interval 1,495 ms (old bound false)</text>
<text x="12" y="154" font-size="8" fill="#FFF">near the end</text>
<circle cx="949.08" cy="150" r="3.6" fill="#8C9BFF"/>
<text x="941.08" y="153" font-size="7.4" fill="#F2F3F8" text-anchor="end">requested/displayed T = last PTS 29.97 s (clamp)</text>
<circle cx="864.51" cy="172" r="3.6" fill="#9AA0B8"/>
<text x="856.51" y="175" font-size="7.4" fill="#F2F3F8" text-anchor="end">cached tile 9: PTS 26.91 s (reported) → approximate, error 3,057 ms → endpoint decode requested</text>
<circle cx="949.08" cy="194" r="3.6" fill="#2EC4B6"/>
<text x="941.08" y="197" font-size="7.4" fill="#F2F3F8" text-anchor="end">endpoint decode (live request) PTS 29.97 s replaces it; a superseded or older-gen frame never does</text>
<circle cx="949.08" cy="216" r="3.6" fill="#2A9D8F"/>
<text x="941.08" y="219" font-size="7.4" fill="#F2F3F8" text-anchor="end">exact seek on release: decoded PTS recorded and compared with T_r in the emulator proof (not promised)</text>
<text x="12" y="264" font-size="8" fill="#FFF">VFR clip</text>
<line x1="120" y1="260" x2="950" y2="260" stroke="#5A5C6A"/>
