<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980.0 488.0" width="1960.0" height="976.0" font-family="Funnel Sans, Inter, Arial, sans-serif"><title>VIDEO-V2 preview timestamps</title>
<rect width="980" height="488" fill="#1B1C24"/>
<text x="12" y="18" font-size="11" fill="#FFF" font-weight="600">PROPOSED timestamp truth · d = 30 s, N = 10 · nominal grid vs requested T vs decoded PTS (synthetic)</text>
<text x="12" y="32" font-size="8" fill="#9AA0B8">Nominal offsets t_i = i·(d − 100 ms)/N [V16] are request times, not frame timestamps. Numbers come from contract.py (cases C6, C7).</text>
<text x="12" y="74" font-size="8" fill="#FFF">nominal grid</text>
