name: AutoDev tenant check
# Cheap check on every PR so docs-only and non-app PRs also have exact-head CI for the
# AutoDev merge join. No Android SDK, no secrets, about one billed minute.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: atlas-autodev-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Tenant manifest is valid JSON
        run: python3 -m json.tool .autodev/project.json > /dev/null
      - name: Preview signing trust boundary
        run: python3 -m unittest discover -s .github/tests -p 'test_preview_signing_boundary.py'
      - name: Release source contract
        run: |
          python3 scripts/verify_contract.py
          python3 -m unittest discover -s scripts -p 'test_verify_contract.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all additive .mjs source-contract tests
        shell: bash
        run: |
          set -eo pipefail
          shopt -s nullglob
          tests=(test/additive-regressions/*.mjs)
          if (( ${#tests[@]} == 0 )); then
            echo '::error::No additive .mjs source-contract tests found.'
            exit 1
          fi
          echo "Discovered ${#tests[@]} additive .mjs source-contract test files:"
          printf ' - %s\n' "${tests[@]}"
          node --test "${tests[@]}"
